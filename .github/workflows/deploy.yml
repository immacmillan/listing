name: Deploy


on:
 push:
   branches:
     - main


jobs:
 deploy-backend:
   name: Deploy backend to Fly.io
   runs-on: ubuntu-latest
   # Only run if server files changed
   if: |
     contains(github.event.head_commit.modified, 'server/') ||
    contains(github.event.head_commit.added, 'server/')
   steps:
     - uses: actions/checkout@v4


     - uses: superfly/flyctl-actions/setup-flyctl@master


     - name: Deploy to Fly.io
       run: flyctl deploy --remote-only
       working-directory: server
       env:
         FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}


 deploy-frontend:
   name: Deploy frontend (Vercel auto-deploys on push)
   runs-on: ubuntu-latest
   steps:
     - name: Vercel deploys automatically on push to main
       run: echo "Vercel auto-deploy triggered by push to main"
