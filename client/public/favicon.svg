<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Denver Dream House favicon: evergreen, clay tile roof, lake, distant golf flag -->
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="13"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- Sky -->
    <rect width="64" height="64" fill="#cfe6dd"/>
    <!-- Distant hill on the horizon -->
    <path d="M0 30 Q 20 24 40 29 T 64 28 V 40 H 0 Z" fill="#9dc4ae"/>
    <!-- Golf flag in the distance (on the hill) -->
    <rect x="49.5" y="18" width="1.4" height="11" rx="0.7" fill="#5b4636"/>
    <path d="M50.9 18 L 58 20.5 L 50.9 23 Z" fill="#e0432d"/>
    <!-- Lake band behind the house -->
    <rect y="36" width="64" height="12" fill="#4f93b8"/>
    <path d="M0 38.5 H 64 M0 42 H 64 M0 45.5 H 64" stroke="#7fb5d2" stroke-width="1.2" stroke-dasharray="5 4"/>
    <!-- Foreground lawn -->
    <rect y="46" width="64" height="18" fill="#3f7d4e"/>
    <!-- House body -->
    <rect x="24" y="34" width="26" height="20" fill="#f3ead9"/>
    <!-- Clay tile roof (burnt orange) -->
    <path d="M21 36 L 37 22 L 53 36 Z" fill="#c1502e"/>
    <path d="M25.5 32 L 48.5 32 M28.5 29.5 L 45.5 29.5 M31.5 27 L 42.5 27 M34.5 24.5 L 39.5 24.5"
          stroke="#a03d20" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Door + window -->
    <rect x="34" y="43" width="6.5" height="11" rx="1" fill="#7a4a2b"/>
    <rect x="43" y="39" width="5.5" height="5.5" rx="0.8" fill="#bfe0ee" stroke="#8a6a4c" stroke-width="0.9"/>
    <!-- Evergreen tree -->
    <rect x="12.6" y="49" width="3" height="7" fill="#5b4636"/>
    <path d="M14.1 18 L 22.5 32 L 5.7 32 Z" fill="#1f5b3f"/>
    <path d="M14.1 25 L 24 40 L 4.2 40 Z" fill="#1a4f36"/>
    <path d="M14.1 32.5 L 25.5 49 L 2.7 49 Z" fill="#153f2b"/>
  </g>
</svg>
